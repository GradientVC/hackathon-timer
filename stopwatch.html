<title>Ascent Clock</title>
<meta name="description" content="Count-up stopwatch for the Gradient hackathon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Single committed theme: this is a projected screen. Brand black ground, off-white type,
   olive as the cold accent, red as heat. Both pairings are approved in the brand guide. */
:root{
  --ground:#11191F;
  --ink:#FAF9F6;
  --olive:#D8D8B8;
  --red:#EA4335;
  --accent:#D8D8B8;
  --muted:rgba(250,249,246,.52);
  --dim:rgba(250,249,246,.3);
  --faint:rgba(250,249,246,.14);
  --display:"FK Grotesk","Inter Tight","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"FK Grotesk Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ui:clamp(11px,1.15vw,20px);
  --pad:clamp(16px,3vmin,40px);
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}

#field{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;image-rendering:pixelated}

.stage{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;padding:var(--pad);gap:var(--pad) 0;box-sizing:border-box}
.stage.idle{cursor:none}

/* Segmented rule along the top edge: segments fill left to right as time passes. */
.rule{position:absolute;top:0;left:0;right:0;height:5px;display:flex;gap:4px}
.seg{flex:1;background:var(--faint);position:relative;overflow:hidden}
.seg i{position:absolute;inset:0;background:var(--accent);transform-origin:left center;transform:scaleX(1);will-change:transform}

.corner{font-size:var(--ui);line-height:1.35;letter-spacing:.04em;min-width:0}
.tl{grid-area:1/1}
.tr{grid-area:1/2;text-align:right}
.bl{grid-area:3/1;align-self:end}
.br{grid-area:3/2;justify-self:end;align-self:end;text-align:right}
.eyebrow{margin:0 0 .3em;font-size:.78em;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:500}
.value{margin:0;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.laps{margin:0;padding:0;list-style:none;display:grid;gap:.1em;font-size:1.25em;line-height:1.25;color:var(--muted)}
.laps li{display:flex;justify-content:flex-end;gap:1em;font-variant-numeric:tabular-nums;white-space:nowrap}
.laps li:first-child{color:var(--ink)}
.laps li b{font-weight:500;color:var(--muted)}

.clock{grid-area:2/1/3/3;place-self:center;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vmin,24px);max-width:100%;text-align:center}
.time{appearance:none;background:none;border:0;padding:0 .02em;margin:0;cursor:pointer;color:var(--ink);
  font-family:var(--display);font-weight:800;font-size:min(32vw,58vh);line-height:.86;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;white-space:nowrap;transform-origin:center}
.time[data-len="7"]{font-size:min(23vw,58vh)}
.time[data-len="8"]{font-size:min(20vw,58vh)}
.time:focus-visible{outline:2px solid var(--accent);outline-offset:.04em}
.time.tick{animation:tick .32s cubic-bezier(.2,.8,.2,1)}
@keyframes tick{0%{transform:scale(1)}30%{transform:scale(1.025)}100%{transform:scale(1)}}
.status{display:flex;gap:1.2em;align-items:baseline;font-size:clamp(12px,1.5vw,26px);letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums}
.over{color:var(--muted);letter-spacing:.06em}
.over:empty{display:none}

.wordmark{display:block;line-height:0}
.wordmark svg{height:clamp(14px,1.55vw,26px);width:auto;display:block}
.wordmark .logo-white{display:none}
.stage[data-hot="1"] .wordmark .logo-inv{display:none}
.stage[data-hot="1"] .wordmark .logo-white{display:block}

.controls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.15em 1.5em;transition:opacity .5s}
.controls button,.controls a{appearance:none;background:none;border:0;margin:0;padding:.3em 0;color:var(--muted);font:inherit;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  text-decoration:underline;text-decoration-color:transparent;text-underline-offset:.4em;text-decoration-thickness:1px;transition:color .2s,text-decoration-color .2s;white-space:nowrap}
.controls button:hover,.controls button:focus-visible,.controls a:hover,.controls a:focus-visible{color:var(--ink);text-decoration-color:var(--accent);outline:none}
.controls button[hidden]{display:none}
.controls kbd{font:inherit;color:var(--dim);margin-left:.55em;letter-spacing:.06em;text-transform:none}
.stage.idle .controls{opacity:0;pointer-events:none}

@media (max-width:640px){
  .stage{grid-template-rows:auto 1fr auto auto;gap:calc(var(--pad)*.7) 0}
  .bl{grid-area:3/1/4/3}
  .br{grid-area:4/1/5/3;justify-self:start;text-align:left}
  .controls{justify-content:flex-start;gap:.1em 1.2em}
}
@media (hover:none) and (pointer:coarse){.controls kbd{display:none}}
@media (prefers-reduced-motion:reduce){.time.tick{animation:none}.controls{transition:none}}
</style>

<canvas id="field" aria-hidden="true"></canvas>

<div class="stage" id="stage" data-state="standby" data-hot="0">
  <div class="rule" id="rule" aria-hidden="true"></div>

  <div class="corner tl">
    <p class="eyebrow">Gradient ascent</p>
    <p class="value">step <span id="step">000</span></p>
    <p class="value" id="limitRow" hidden>limit <span id="limit">05:00</span></p>
  </div>

  <div class="corner tr">
    <p class="eyebrow">laps</p>

  </div>

  <main class="clock">
    <button class="time" id="time" type="button" aria-label="Start or pause the stopwatch" aria-live="off" data-len="5">00:00</button>
    <div class="status" role="status" aria-live="polite"><span id="status">Standby</span><span class="over" id="over"></span></div>
  </main>

  <div class="corner bl">
    <span class="wordmark" aria-label="Gradient">
      <svg class="logo-inv" role="img" aria-hidden="true" width="980" height="123" viewBox="0 0 980 123" fill="none" xmlns="http://www.w3.org/2000/svg">

    </span>
  </div>

  <div class="corner br controls" id="controls">
    <button type="button" data-act="toggle"><span>Start</span><kbd>space</kbd></button>
    <button type="button" data-act="lap"><span>Lap</span><kbd>L</kbd></button>
    <button type="button" data-act="reset"><span>Reset</span><kbd>R</kbd></button>
    <button type="button" data-act="minus" data-limit hidden><span>Limit &minus;1</span><kbd>&darr;</kbd></button>
    <button type="button" data-act="plus" data-limit hidden><span>Limit +1</span><kbd>&uarr;</kbd></button>
    <button type="button" data-act="full"><span>Fullscreen</span><kbd>F</kbd></button>
    <button type="button" data-act="sound"><span>Sound on</span><kbd>M</kbd></button>
    <a href="https://gradientvc.github.io/hackathon-timer/"><span>Countdown</span><kbd>&nearr;</kbd></a>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), canvas = $('#field'), ctx = canvas.getContext('2d', { alpha: false });
  const timeEl = $('#time'), statusEl = $('#status'), overEl = $('#over'), stepEl = $('#step'), limitEl = $('#limit'), limitRow = $('#limitRow'), lapsEl = $('#laps'), ruleEl = $('#rule');
  const btnToggle = $('[data-act="toggle"]'), btnSound = $('[data-act="sound"]'), limitBtns = document.querySelectorAll('[data-limit]');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerpC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
  const rgb = c => 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  const pad = n => String(n).padStart(2, '0');
  const fmt = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return (h ? h + ':' : '') + pad(m) + ':' + pad(r); };

  // ---- optional limit: ?limit=5 (minutes, fractions allowed) or ?m=5; arrows adjust it by a minute
  const params = new URLSearchParams(location.search);
  const rawLimit = params.get('limit') ?? params.get('m');
  let limit = rawLimit !== null && +rawLimit > 0 ? clamp(Math.round(+rawLimit * 60), 10, 12 * 3600) : 0; // seconds, 0 = none
  let unit = 300, segs = [];

  let state = 'standby', base = 0, startedAt = 0, soundOn = true, lastSec = -1, laps = [], crossed = false;
  const elapsed = () => state === 'running' ? base + (Date.now() - startedAt) : base;

  function setState(s) {
    state = s; stage.dataset.state = s;
    btnToggle.firstElementChild.textContent = s === 'running' ? 'Pause' : s === 'paused' ? 'Resume' : 'Start';
    if (s !== 'running') stage.classList.remove('idle');
    wake();
  }
  function start() { ensureAudio(); startedAt = Date.now(); setState('running'); }
  function pause() { base = elapsed(); setState('paused'); }
  function toggle() { state === 'running' ? pause() : start(); }
  function reset() { base = 0; laps = []; crossed = false; overEl.textContent = ''; renderLaps(); setState('standby'); render(true); }
  function lap() {
    if (state !== 'running') return;
    const t = elapsed(), prev = laps.length ? laps[laps.length - 1].total : 0;
    laps.push({ n: laps.length + 1, split: t - prev, total: t });
    renderLaps(); blip();
  }
  function adjustLimit(min) {
    if (!limit) return;
    limit = clamp(limit + min * 60, 60, 12 * 3600);
    buildRule(); render(true);
  }
  function renderLaps() {
    if (!laps.length) { lapsEl.innerHTML = '<li><b>&mdash;</b></li>'; return; }
    lapsEl.innerHTML = laps.slice(-5).reverse().map(l =>
      '<li><b>' + pad(l.n) + '</b><span>' + fmt(Math.floor(l.split / 1000)) + '</span></li>').join('');
  }

  function buildRule() {
    let n;
    if (limit) { unit = limit <= 1200 ? 60 : limit <= 3600 ? 300 : 900; n = Math.ceil(limit / unit); }
    else { unit = 300; n = 12; }                       // no limit: twelve five-minute segments, one hour per row
    ruleEl.textContent = ''; segs = [];
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span'); s.className = 'seg';
      const f = document.createElement('i'); s.appendChild(f); ruleEl.appendChild(s); segs.push(f);
    }
    limitRow.hidden = !limit; limitBtns.forEach(b => { b.hidden = !limit; });
    if (limit) limitEl.textContent = fmt(limit);
  }

  // ---- heat: cold with no limit; barely warms until the last minute before the limit, flat red past it
  function heat(p) {
    const knee = Math.max(0, 1 - 60 / limit);
    if (knee <= 0) return p * p;
    if (p < knee) return 0.15 * (p / knee);
    const q = (p - knee) / (1 - knee);
    return 0.15 + 0.85 * Math.pow(q, 1.6);
  }

  const GROUND = [17, 25, 31], OXBLOOD = [44, 12, 10], COLD_HI = [108, 112, 92], RED = [234, 67, 53], OLIVE = [216, 216, 184], INK = [250, 249, 246];
  let lastAccent = '';
  function applyHeat(h, over) {
    const acc = over ? INK : lerpC(OLIVE, RED, h * h);
    const css = rgb(acc);
    if (css !== lastAccent) { lastAccent = css; stage.style.setProperty('--accent', css); }
    stage.dataset.hot = (h > 0.55 || over) ? '1' : '0';
  }

  function render(force) {
    const ms = elapsed(), secs = Math.floor(ms / 1000);
    const over = !!limit && ms >= limit * 1000;
    if (over && !crossed) { crossed = true; chime(); }
    if (!over) crossed = false;
    if (secs !== lastSec || force) {
      lastSec = secs;
      const txt = fmt(secs);
      timeEl.textContent = txt; timeEl.dataset.len = String(txt.length);
      stepEl.textContent = String(secs).padStart(3, '0');
      document.title = state === 'standby' ? 'Ascent Clock' : txt + ' · Ascent Clock';
    }
    statusEl.textContent = state === 'standby' ? 'Standby' : state === 'paused' ? 'Paused' : over ? 'Diverged'
      : (limit && limit * 1000 - ms <= 60000 ? 'Unstable' : 'Ascending');
    overEl.textContent = over ? '+' + fmt(Math.floor((ms - limit * 1000) / 1000)) : '';
    const s = ms / 1000, pos = limit ? s : s % (segs.length * unit);
    for (let i = 0; i < segs.length; i++) segs[i].style.transform = 'scaleX(' + clamp((pos - i * unit) / unit, 0, 1).toFixed(4) + ')';
    const h = limit ? (over ? 1 : heat(ms / (limit * 1000))) : 0;
    applyHeat(h, over);
    return h;
  }

  // ---- the field: a drifting loss landscape, rendered at coarse cells with ordered dither
  const BUMPS = [
    { a: .21, b: .17, pa: 0.3, pb: 1.9, s: .30, w: 1.0 },
    { a: .13, b: .23, pa: 2.1, pb: 0.4, s: .22, w: .85 },
    { a: .19, b: .11, pa: 4.0, pb: 3.1, s: .26, w: .9 },
    { a: .09, b: .15, pa: 1.2, pb: 5.0, s: .36, w: .6 },
    { a: .17, b: .27, pa: 5.5, pb: 2.6, s: .18, w: .7 },
  ];
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
  const LEVELS = 6;
  let cols = 0, rows = 0, img = null, data = null;

  function grid() {
    const W = Math.max(1, innerWidth, document.documentElement.clientWidth), H = Math.max(1, innerHeight, document.documentElement.clientHeight);
    const cell = Math.max(5, Math.round(Math.min(W, H) / 84));
    return [Math.max(1, Math.ceil(W / cell)), Math.max(1, Math.ceil(H / cell))];
  }
  function needsResize() { const g = grid(); return g[0] !== cols || g[1] !== rows; }
  function resize() {
    [cols, rows] = grid();
    canvas.width = cols; canvas.height = rows;
    img = ctx.createImageData(cols, rows); data = img.data;
    drawField(lastH, lastT);
  }

  function drawField(h, t) {
    if (!img) return;
    const aspect = cols / rows;
    const cs = BUMPS.map(b => ({
      x: (0.5 + 0.38 * Math.sin(t * b.a + b.pa)) * aspect,
      y: 0.5 + 0.38 * Math.cos(t * b.b + b.pb),
      k: -1 / (2 * b.s * b.s), w: b.w
    }));
    const flat = smoothstep(0.85, 1, h);
    const lo = lerpC(GROUND, OXBLOOD, h), hi = lerpC(COLD_HI, RED, smoothstep(0, 0.75, h));
    const L = LEVELS - 1;
    let o = 0;
    for (let y = 0; y < rows; y++) {
      const v = y / rows, by = (y & 3) << 2;
      for (let x = 0; x < cols; x++) {
        const u = x / cols * aspect;
        let s = 0;
        for (let i = 0; i < cs.length; i++) { const c = cs[i], dx = u - c.x, dy = v - c.y; s += c.w * Math.exp((dx * dx + dy * dy) * c.k); }
        let val = Math.min(1, s / 1.15); val = Math.pow(val, 1.5); val += (1 - val) * flat;
        const q = Math.min(L, Math.floor(val * L + BAYER[by | (x & 3)])) / L;
        data[o++] = lo[0] + (hi[0] - lo[0]) * q;
        data[o++] = lo[1] + (hi[1] - lo[1]) * q;
        data[o++] = lo[2] + (hi[2] - lo[2]) * q;
        data[o++] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  // ---- loop
  let lastH = 0, lastT = 0, lastField = 0, t0 = performance.now(), visible = true;
  function frame(now) {
    if (!visible) return;
    if (!img || needsResize()) resize();
    lastH = render(false);
    if (now - lastField > 1000 / 24) {
      lastField = now;
      lastT = reduced ? 0 : (now - t0) / 1000 * 0.12;
      drawField(lastH, lastT);
    }
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    visible = !document.hidden;
    if (visible) requestAnimationFrame(frame);
  });
  setInterval(() => { if (!visible) render(false); }, 500);

  // ---- sound: a single blip per lap, three ascending tones at the limit
  let actx = null;
  function ensureAudio() {
    try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; }
  }
  function tone(f, at, dur, peak) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g).connect(actx.destination);
    o.start(at); o.stop(at + dur + 0.02);
  }
  function chime() { if (!soundOn || !actx) return; const now = actx.currentTime; [[440, 0], [660, .22], [880, .44]].forEach(([f, dt]) => tone(f, now + dt, 0.34, 0.32)); }
  function blip() { if (!soundOn || !actx) return; tone(880, actx.currentTime, 0.1, 0.14); }
  function toggleSound() { soundOn = !soundOn; btnSound.firstElementChild.textContent = soundOn ? 'Sound on' : 'Sound off'; }

  function fullscreen() {
    const el = document.documentElement;
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch (e) {}
  }

  // ---- input
  const ACTIONS = { toggle, lap, reset, minus: () => adjustLimit(-1), plus: () => adjustLimit(1), full: fullscreen, sound: toggleSound };
  document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => { ACTIONS[b.dataset.act](); b.blur(); }));
  timeEl.addEventListener('click', () => { toggle(); timeEl.blur(); });

  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    switch (e.key) {
      case ' ': case 'Enter': if (onButton) return; e.preventDefault(); toggle(); break;
      case 'l': case 'L': lap(); break;
      case 'r': case 'R': reset(); break;
      case 'f': case 'F': fullscreen(); break;
      case 'm': case 'M': toggleSound(); break;
      case 'ArrowUp': e.preventDefault(); adjustLimit(1); break;
      case 'ArrowDown': e.preventDefault(); adjustLimit(-1); break;
      default: return;
    }
  });

  let idleT = 0;
  function wake() {
    stage.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => { if (state === 'running') stage.classList.add('idle'); }, 2500);
  }
  ['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));

  let rz = 0;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(resize, 80); });

  buildRule(); renderLaps(); setState('standby'); resize(); render(true); requestAnimationFrame(frame);
})();
</script>
